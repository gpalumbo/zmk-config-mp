# Soyuz Numpad Configuration

# Uncomment to enable encoder support if you add one
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Bluetooth settings
CONFIG_ZMK_BLE=y

# USB settings (nice!nano can do USB or BLE)
CONFIG_ZMK_USB=y

# Keyboard name shown in Bluetooth pairing
CONFIG_ZMK_KEYBOARD_NAME="Soyuz Numpad"

# Increase Bluetooth power for better connection (optional)
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
